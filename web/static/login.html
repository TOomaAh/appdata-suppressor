<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Appdata Cleaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<form class="login-card" id="loginForm">
  <div class="logo"><div class="icon">🐳</div>Appdata Cleaner</div>

  <label for="user">User</label>
  <input id="user" name="user" autocomplete="username" required autofocus>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <div id="loginError" class="login-error" hidden></div>

  <button class="btn btn-primary" id="loginBtn" type="submit">Log in</button>
</form>

<script src="login.js"></script>
</body>
</html>
